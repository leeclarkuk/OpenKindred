# For rendering without docker: run function-go-templating locally (see
# hack/build-render-tools.sh) and the CLI will call it on localhost:9443.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
  annotations:
    render.crossplane.io/runtime: Development
    render.crossplane.io/runtime-development-target: localhost:9443
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.13.0
