apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: models.openkindred.io
spec:
  group: openkindred.io
  scope: Namespaced
  names:
    kind: Model
    listKind: ModelList
    plural: models
    singular: model
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [provider, model]
              properties:
                provider:
                  type: string
                  description: Backend serving the model.
                  enum: [anthropic, openai-compatible, vllm, bedrock, vertex]
                model:
                  type: string
                  description: Provider-side model identifier.
                endpoint:
                  type: string
                  description: Base URL. Required for self-hosted and openai-compatible providers.
                credentialsRef:
                  type: object
                  description: Secret holding provider credentials. Omit when workload identity is used.
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                limits:
                  type: object
                  properties:
                    maxTokens:
                      type: integer
                      minimum: 1
                    requestsPerMinute:
                      type: integer
                      minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
